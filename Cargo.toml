[package]
name = "beepaper"
version = "0.1.0"
edition = "2024"
description = "CLI wallpaper discovery, selection, and native Wayland wallpaper utility"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
directories = "5.0"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.13"
thiserror = "2.0"
toml = "0.8"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
walkdir = "2.5"
